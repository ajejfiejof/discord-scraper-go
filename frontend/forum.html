<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DSA Archive Browser — Forum</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#eee;margin:0}
  header{background:#1a1a1a;padding:16px;border-bottom:1px solid #333;display:flex;gap:16px;align-items:center}
  header h1{margin:0;font-size:20px}
  header a{color:#5BCEFA;text-decoration:none}
  .container{display:flex;height:calc(100vh - 60px)}
  .sidebar{width:360px;background:#161616;border-right:1px solid #333;overflow:auto}
  .main{flex:1;overflow:auto;padding:16px}
  .topic{padding:10px 12px;cursor:pointer;border-bottom:1px solid #222}
  .topic:hover{background:#222}
  .topic.active{background:#5BCEFA;color:#000}
  .post{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:12px}
  .post .meta{color:#888;font-size:12px;margin-bottom:6px}
  input{padding:8px;border:1px solid #333;border-radius:6px;background:#222;color:#eee;flex:1}
</style>
</head>
<body>
<header>
  <h1>💬 Forum Archive</h1>
  <a href="/">→ Discord</a>
  <a href="/insights.html">Insights</a>
</header>
<div style="padding:12px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;gap:8px">
  <input id="q" placeholder="search title…" oninput="loadTopics()">
  <button onclick="loadTopics()" style="padding:8px 16px;background:#5BCEFA;border:0;border-radius:6px;cursor:pointer">Search</button>
</div>
<div class="container">
  <div class="sidebar" id="topics">Loading topics…</div>
  <div class="main" id="posts">Select a topic</div>
</div>
<script>
let topics=[];
function loadTopics(){
  const q=document.getElementById('q').value;
  document.getElementById('topics').innerHTML='Loading…';
  fetch('/api/forum/topics?q='+encodeURIComponent(q)).then(r=>r.json()).then(d=>{
    topics=d.topics||[];
    const el=document.getElementById('topics');
    el.innerHTML=`<div style="padding:8px;color:#888">${d.count} topics</div>`;
    topics.forEach(t=>{
      const div=document.createElement('div');
      div.className='topic';
      div.innerHTML=`<b>${escapeHtml(t.title.slice(0,80))}</b><br><span style="font-size:12px;color:#888">${t.posts_count} posts • ${t.category_id} • ${new Date(t.created_at).toLocaleDateString()}</span>`;
      div.onclick=()=>{document.querySelectorAll('.topic').forEach(e=>e.classList.remove('active'));div.classList.add('active');loadPosts(t.id);};
      el.appendChild(div);
    });
  });
}
function loadPosts(id){
  document.getElementById('posts').innerHTML='Loading posts…';
  fetch('/api/forum/posts?topic='+id).then(r=>r.json()).then(d=>{
    const cont=document.getElementById('posts');
    cont.innerHTML=`<h2>${escapeHtml(d.title||'Topic '+id)}</h2><div style="color:#888">${d.post_stream.posts.length} posts</div>`;
    d.post_stream.posts.forEach(p=>{
      const div=document.createElement('div');
      div.className='post';
      div.innerHTML=`<div class=meta><b>${p.username}</b> • ${new Date(p.created_at).toLocaleString()} • #${p.post_number}</div><div>${p.cooked||escapeHtml(p.raw||'')}</div>`;
      cont.appendChild(div);
    });
  });
}
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
loadTopics();
</script>
</body>
</html>
